<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rider Jukebox</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Socket.io -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
  <div class="container">
    <h1>🏍️ Rider Jukebox</h1>

    <!-- 1. AUTH SCREEN -->
    <div id="auth-screen" class="card">
      <h2>Welcome Rider</h2>
      <p>Log in with Google to sync music and talk real-time during rides.</p>
      <button onclick="loginWithGoogle()" class="btn-google">Sign in with Google</button>
    </div>

    <!-- 2. LOBBY OPTIONS SCREEN -->
    <div id="lobby-screen" class="card" style="display:none;">
      <div class="user-header">
        <p>Logged in as: <strong id="user-display-name">...</strong></p>
        <button onclick="logout()" class="btn-secondary">Log Out</button>
      </div>

      <div class="lobby-actions">
        <h3>Create or Join Ride</h3>
        <button onclick="createLobby()" class="btn-primary">Create New Lobby</button>
        <hr>
        <div class="input-group">
          <input type="text" id="join-room-input" placeholder="Enter Room Code (e.g. RIDE123)" />
          <button onclick="joinLobby()" class="btn-secondary">Join Lobby</button>
        </div>
      </div>
    </div>

    <!-- 3. JUKEBOX INTERFACE SCREEN -->
    <div id="jukebox-screen" class="card" style="display:none;">
      <div class="room-bar">
        <h3>Room: <span id="display-room-code">---</span></h3>
        <button onclick="leaveLobby()" class="btn-danger">Leave</button>
      </div>

      <!-- Synchronized YouTube Player -->
      <div class="player-section">
        <h4 id="now-playing-title">No video playing</h4>
        <div id="youtube-player"></div>
      </div>

      <!-- YouTube Search -->
      <div class="search-section">
        <input type="text" id="yt-search-input" placeholder="Search song or artist..." />
        <button onclick="searchYouTube()" class="btn-primary">Search</button>
      </div>

      <div id="search-results" class="results-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
